repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/osprey-oss/deptry.git
    rev: 0c39226d761685125c5ff71ca81282d6751c9540 # 0.25.1
    hooks:
      - id: deptry
        # The upstream hook hardcodes `deptry .` and would flag the test/dev
        # tooling; scan only the shipped package.
        entry: deptry django_dbos
        pass_filenames: false
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.14.0
    hooks:
      - id: zizmor
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
