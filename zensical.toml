[project]
site_url = "https://lewoudar.github.io/django-dbos/"
site_name = "django-dbos"
site_description = "DBOS-backed backend for Django's tasks framework: durable background tasks, cron scheduling and optional Sentry monitoring."
site_author = "Kevin Tewouda"

copyright = "Copyright &copy; 2026 Kevin Tewouda"

repo_url = "https://github.com/lewoudar/django-dbos"
repo_name = "lewoudar/django-dbos"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Your first task" = "first-task.md" },
  { "Tasks" = "tasks.md" },
  { "Cron scheduling" = "cron.md" },
  { "Workflows" = "workflows.md" },
  { "Testing" = "testing.md" },
  { "Configuration" = "configuration.md" },
  { "Admin" = "admin.md" },
  { "Worker capacity" = "status.md" },
  { "Deployment" = "deployment.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "AI agents" = "ai-agents.md" },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
