# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# llms.txt index (and a Markdown copy of every page) for AI agents reading
# the site; llms-full.txt concatenates all pages in a single file.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
Durable background tasks for Django's `django.tasks` framework, backed by
DBOS: tasks survive crashes and restarts, retries and timeouts are declared
per task, and `@cron` schedules periodic tasks (with optional Sentry cron
monitors). Workers run with `manage.py dbos worker`; web processes only
enqueue. Coding agents can also install the `django-dbos` agent skill (see
"AI agents").
"""

[project.plugins.llmstxt.sections]
"Getting started" = ["index.md", "first-task.md", "configuration.md"]
"Guides" = [
  "tasks.md",
  "workflows.md",
  "cron.md",
  "admin.md",
  "status.md",
  "testing.md",
  "deployment.md",
  "troubleshooting.md",
]
# "Optional" is special in the llms.txt spec: agents short on context may skip it.
"Optional" = ["ai-agents.md"]
