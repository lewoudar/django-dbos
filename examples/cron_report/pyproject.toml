[project]
name = "cron-report-example"
version = "0.1.0"
description = "django-dbos example: a @cron task that logs a periodic report."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-dbos",
    "structlog>=25.1",
]

[tool.uv]
package = false

[tool.uv.sources]
django-dbos = { path = "../..", editable = true }
